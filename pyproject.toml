[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sierpinski"
version = "1.0.0"
description = "Pascal modulo p varrido linha a linha, com a formula dos digitos na base p como juiz independente."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "condeDeveloper" }]
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: MIT License",
  "Topic :: Scientific/Engineering :: Mathematics",
]

[project.scripts]
sierpinski = "sierpinski.__main__:main"

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.setuptools.packages.find]
include = ["sierpinski*"]

[tool.pytest.ini_options]
testpaths = ["testes"]
addopts = "-q"
